{% extends "base_patient.html" %}

{% block content %}
<div class="container-fluid">
    <!-- Page Heading -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">Book New Appointment</h1>
        <a href="{{ url_for('patient_dashboard') }}" class="btn btn-secondary btn-icon-split">
            <span class="icon text-white-50">
                <i class="fas fa-arrow-left"></i>
            </span>
            <span class="text">Back to Dashboard</span>
        </a>
    </div>

    <!-- Booking Form -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Appointment Details</h6>
        </div>
        <div class="card-body">
            <form method="POST" id="appointmentForm">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="department">Department</label>
                            <select class="form-control" id="department" name="department">
                                <option value="">All Departments</option>
                                {% for dept in departments %}
                                <option value="{{ dept.department_id }}">{{ dept.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="doctor_id">Doctor</label>
                            <select class="form-control" id="doctor_id" name="doctor_id" required>
                                <option value="">Select Doctor</option>
                                {% for doctor in doctors %}
                                <option value="{{ doctor.doctor_id }}">

                                Dr. {{ doctor.first_name }} {{ doctor.last_name }} ({{ doctor.department_name }})

                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="date">Appointment Date</label>
                            <input type="date" class="form-control" id="date" name="date" required 
                                   min="{{ min_date }}" max="{{ max_date }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            
                            <label for="time">Select Time:</label>
                            <input type="time" name="time" required>

                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reason">Reason for Visit</label>
                    <textarea class="form-control" id="reason" name="reason" rows="3" 
                              placeholder="Briefly describe the reason for your visit"></textarea>
                </div>

                <div class="form-group">
                    <div class="custom-control custom-checkbox">
                        <input type="checkbox" class="custom-control-input" id="terms" required>
                        <label class="custom-control-label" for="terms">
                            I confirm that all information provided is accurate
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-calendar-check mr-2"></i>Book Appointment
                </button>
            </form>
        </div>
    </div>

    <!-- Doctor Availability -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Doctor Availability</h6>
        </div>
        <div class="card-body">
            <div id="availabilityCalendar"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    // Filter doctors by department
    $('#department').change(function() {
        var departmentId = $(this).val();
        $('#doctor_id option').show();
        if (departmentId) {
            $('#doctor_id option').not('[data-department="' + departmentId + '"], [value=""]').hide();
        }
        $('#doctor_id').val('');
    });

    // Date picker restrictions
    $('#date').change(function() {
        // In a real app, you would fetch available time slots from the server
        console.log("Date selected: " + $(this).val());
    });
});
</script>
{% endblock %}
