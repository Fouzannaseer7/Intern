{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Schedule Appointment</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('appointments') }}">
                    <div class="mb-3">
                        <label for="doctor" class="form-label">Doctor Name</label>
                        <select class="form-select" id="doctor" name="doctor" required>
                            <option value="" selected disabled>Select a doctor</option>
                            <option value="Dr. Smith">Dr. Smith (Cardiology)</option>
                            <option value="Dr. Johnson">Dr. Johnson (Pediatrics)</option>
                            <option value="Dr. Williams">Dr. Williams (Neurology)</option>
                        </select>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="date" class="form-label">Date</label>
                            <input type="date" class="form-control" id="date" name="date" required>
                        </div>
                        <div class="col-md-6">
                            <label for="time" class="form-label">Time</label>
                            <input type="time" class="form-control" id="time" name="time" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="reason" class="form-label">Reason</label>
                        <textarea class="form-control" id="reason" name="reason" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Schedule Appointment</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
